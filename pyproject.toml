[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contastock-pro"
version = "1.0.0"
description = "Sistema profesional de contabilidad, ventas e inventario para almacenes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "ElectroGalindez" }]
keywords = ["contabilidad", "inventario", "ventas", "deudas", "sqlite", "flask"]
dependencies = [
    "flask>=3.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "bcrypt>=4.0",
    "reportlab>=3.6",
    "openpyxl>=3.0",
    "python-dotenv>=1.0",
    "pywebview>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pyinstaller>=6.0",
]

[project.scripts]
contastock = "desktop:main"

[tool.setuptools]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]